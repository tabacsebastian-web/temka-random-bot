<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Temka Random — Provably Fair Telegram Giveaways</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f19;
      --card: #121826;
      --border: #1f293d;
      --text: #e6edf7;
      --muted: #93a4c3;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #15223b 0%, var(--bg) 55%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.14);
      color: var(--ok);
      border: 1px solid rgba(34, 197, 94, 0.35);
    }
    .badge.warn {
      background: rgba(245, 158, 11, 0.14);
      color: var(--warn);
      border-color: rgba(245, 158, 11, 0.35);
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.55;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }
    .stat {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .stat-val {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }
    .cta {
      display: inline-block;
      text-decoration: none;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: #fff;
      font-weight: 600;
      padding: 12px 18px;
      border-radius: 12px;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .cta:hover { transform: translateY(-1px); opacity: 0.95; }
    .meta {
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    code { color: var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <div class="header">
      <h1>🎁 Temka Random</h1>
      <span id="status-badge" class="badge">Checking...</span>
    </div>
    <p>
      Provably Fair Telegram Giveaway Bot powered by Cloudflare Workers, D1 SQLite,
      and SHA-256 / HMAC-SHA256 verifiable draws.
    </p>
    <div class="grid">
      <div class="stat">
        <div class="stat-label">Runtime</div>
        <div id="runtime" class="stat-val">Cloudflare Workers</div>
      </div>
      <div class="stat">
        <div class="stat-label">Database</div>
        <div id="d1" class="stat-val">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Version</div>
        <div id="version" class="stat-val">—</div>
      </div>
    </div>
    <a class="cta" href="https://t.me/TemkaDrawBot" target="_blank" rel="noopener noreferrer">
      Open @TemkaDrawBot in Telegram
    </a>
    <div class="meta">Health endpoint: <code>/health</code></div>
  </main>
  <script>
    fetch('/health')
      .then((r) => r.json())
      .then((data) => {
        const badge = document.getElementById('status-badge');
        if (data.status === 'ok' && data.configured) {
          badge.textContent = '● Online 24/7';
        } else {
          badge.textContent = '● Setup Pending';
          badge.classList.add('warn');
        }
        document.getElementById('runtime').textContent = data.runtime || 'cloudflare-workers';
        document.getElementById('d1').textContent = data.d1 === 'connected' ? 'D1 Connected' : 'Not Connected';
        document.getElementById('version').textContent = data.version || '3.0.0-cloudflare';
      })
      .catch(() => {
        const badge = document.getElementById('status-badge');
        badge.textContent = '● Offline';
        badge.classList.add('warn');
      });
  </script>
</body>
</html>
